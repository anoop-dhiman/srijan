name: CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'platform/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'platform/**'
      - '.github/workflows/ci.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/srijan-platform
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            platform/web/package-lock.json
      - name: Install backend deps
        run: cd platform && npm ci
      - name: Type-check backend
        run: cd platform && npx tsc --noEmit
      - name: Install frontend deps
        run: cd platform/web && npm ci
      - name: Lint frontend
        run: cd platform/web && npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      SRIJAN_ADMIN_PASSWORD: testpass
      SRIJAN_JWT_SECRET: test-secret
      SRIJAN_SECRETS_KEY: "test-key-32-bytes-long-pad-here!"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            platform/web/package-lock.json
      - name: Install backend deps
        run: cd platform && npm ci
      - name: Run backend tests
        run: cd platform && npm test
      - name: Install frontend deps
        run: cd platform/web && npm ci
      - name: Run frontend tests
        run: cd platform && npm run test:web

  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: platform
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    env:
      SRIJAN_ADMIN_PASSWORD: testpass
      SRIJAN_JWT_SECRET: test-secret
      SRIJAN_SECRETS_KEY: "test-key-32-bytes-long-pad-here!"
      WORKSPACE_ROOT: ${{ github.workspace }}/e2e-workspaces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend deps
        run: cd platform && npm ci
      - name: Build backend
        run: cd platform && npm run build
      - name: Install frontend deps
        run: cd platform/web && npm ci
      - name: Install Playwright browsers
        run: cd platform/web && npx playwright install --with-deps chromium
      - name: Start backend
        run: cd platform && npm start &
      - name: Start frontend
        run: cd platform/web && npm run dev &
      - name: Wait for servers
        run: npx wait-on http://localhost:8080/health http://localhost:5173 --timeout 30000
      - name: Run E2E tests
        run: cd platform/web && npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/web/playwright-report/
          retention-days: 7
