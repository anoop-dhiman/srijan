services:
  caddy:
    image: caddy:2-alpine
    container_name: srijan-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    environment:
      - SRIJAN_DOMAIN=${SRIJAN_DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
    networks:
      - srijan
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  platform:
    image: ghcr.io/anoop-dhiman/srijan-platform:latest
    container_name: srijan-platform
    restart: unless-stopped
    user: "node"
    group_add:
      - "${DOCKER_GID:-999}"
    expose:
      - "8080"
    volumes:
      # WARNING: Mounting the Docker socket grants the container full control over the
      # Docker daemon (equivalent to root on the host). This is required for Srijan to
      # manage user app containers. Restrict access using a Docker socket proxy in
      # high-security deployments (e.g. Tecnativa/docker-socket-proxy).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/workspaces
      - ./data:/data
    environment:
      - PORT=8080
      - SRIJAN_ADMIN_PASSWORD=${SRIJAN_ADMIN_PASSWORD:?SRIJAN_ADMIN_PASSWORD is required}
      - SRIJAN_JWT_SECRET=${SRIJAN_JWT_SECRET:?SRIJAN_JWT_SECRET is required}
      - SRIJAN_SECRETS_KEY=${SRIJAN_SECRETS_KEY:?SRIJAN_SECRETS_KEY is required}
      - SRIJAN_DATA_DIR=/data
      - WORKSPACE_ROOT=/workspaces
      - SRIJAN_DOMAIN=${SRIJAN_DOMAIN:-localhost}
      - SRIJAN_ORIGIN=${SRIJAN_ORIGIN:-}
      - CADDY_ADMIN_URL=http://caddy:2019
    depends_on:
      - caddy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - srijan
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  srijan:
    driver: bridge
